<h1>자막·재생 설정</h1>
<div id="form"></div>
<p>영상 위의 <b>PiP+</b>는 재생 줄이 있는 창, <b>무테</b>는 타이틀바 없는 창입니다. 설정은 열려 있는 PiP에 바로 반영됩니다.</p>
<p>영상 위의 <b>앱으로</b>에서 보던 위치·외부 자막·속도·PIP를 골라 설치된 앱으로 보낼 수 있습니다. 처음에는 앱의 <b>설정 → 북마크·정보 → 확장에서 앱으로 열기 → 확장 연결 등록</b>을 눌러 주세요. 브라우저 로그인 정보는 보내지 않습니다.</p>
